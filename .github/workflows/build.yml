name: Build BazarBondhu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK for arm64
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK exists
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: bazarbondhu-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
